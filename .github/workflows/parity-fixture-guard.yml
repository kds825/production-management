name: Parity Fixture Guard

# Enforces D9-A (strict parity hash, docs/specs §9): any change to
# backend/tests/fixtures/parity/*.json MUST be in a commit whose subject
# begins with "parity-update:". Otherwise this workflow fails the PR.
#
# Why: the parity suite is ground truth for MILP vs heuristic equivalence.
# Silently editing a fixture under a feat:/fix: commit would hide a change
# in expected behavior. The prefix forces the change to be explicit and
# reviewable on its own.
#
# Scope notes:
#   - Glob is exactly backend/tests/fixtures/parity/*.json — matches the
#     11 scenario fixtures + baseline_performance.json, but NOT README.md
#     or future non-JSON sidecars.
#   - Merge commits are excluded (--no-merges); they shouldn't touch
#     fixtures and their "Merge pull request ..." subject would always
#     fail the prefix check.
#   - Reverts of parity-update commits MUST also carry the prefix. The
#     default "Revert \"parity-update: ...\"" subject does not start
#     with "parity-update:" and will fail the guard. This is intentional:
#     reverting a ground-truth change is as consequential as making one.
#
# Security: commit subjects and SHAs are consumed via git CLI output
# (not github.event.* interpolation) and always quoted as shell variables,
# so PR titles / branch names cannot inject commands.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce parity-update prefix on fixture-touching commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          echo "Inspecting commits ${BASE_SHA}..${HEAD_SHA}"

          # Non-merge commits in the PR range, oldest first.
          commits=$(git log --no-merges --format=%H "${BASE_SHA}..${HEAD_SHA}")

          if [ -z "${commits}" ]; then
            echo "::notice::No non-merge commits in PR range; guard skipped."
            exit 0
          fi

          violations=0
          while IFS= read -r sha; do
            subject=$(git log -1 --format=%s "${sha}")
            touched=$(git show --name-only --format= "${sha}" \
              | grep -E '^backend/tests/fixtures/parity/[^/]+\.json$' || true)

            if [ -z "${touched}" ]; then
              continue
            fi

            case "${subject}" in
              "parity-update:"*)
                echo "::notice::${sha} OK (parity-update: prefix present)"
                ;;
              *)
                violations=$((violations + 1))
                echo "::error::D9-A violation: commit ${sha} modifies parity fixture but subject is \"${subject}\". Per docs/specs §9 Decision D9-A (strict parity hash), any change to backend/tests/fixtures/parity/*.json MUST be in a commit whose subject begins with \"parity-update:\". Rewrite history (git rebase -i, amend commit) to use the parity-update: prefix."
                echo "  Offending files in ${sha}:"
                echo "${touched}" | sed 's/^/    /'
                ;;
            esac
          done <<< "${commits}"

          if [ "${violations}" -gt 0 ]; then
            echo "::error::Parity fixture guard failed: ${violations} commit(s) violate D9-A."
            exit 1
          fi

          echo "::notice::Parity fixture guard passed."
