# Path D: Supabase-native for dev; CI uses throwaway Postgres service
name: CI

on:
  push:
    branches:
      [main, refactoring, refactoring-track-a-solver, refactoring-track-b-admin]
  pull_request:
    branches:
      [main, refactoring, refactoring-track-a-solver, refactoring-track-b-admin]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kbi
          POSTGRES_PASSWORD: kbi_poc_2026
          POSTGRES_DB: kbi_scheduler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kbi -d kbi_scheduler"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kbi:kbi_poc_2026@localhost:5432/kbi_scheduler
      LLM_PROVIDER: template

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run alembic migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Seed masterdata (equipment / speed / constraint / drum_lot)
        # 정식 seed 스크립트 호출 — customer_master / process_routing /
        # equipment_master / operation_calendar / drum_lot_master /
        # decision_criteria / speed_master / constraint_config + W-* weight 행.
        # 멱등성 체크 (customer_master count > 0 이면 skip). 2026-05-21 parity
        # harness 폐기 후 fixture 01_nominal.json 의존 (구 seed_masterdata_for_ci.py)
        # 제거.
        working-directory: backend
        run: python seed_db.py

      - name: Augment SpeedMaster (ST-54BO* / TP / CA-* / SH-B100 보강)
        # seed_db.py 의 _speed_master() 는 Supabase 의 수동 입력 행을 가정해 일부
        # 설비 (ST-54BO1/2/3, ST-T6B0, TP-1/GD, CA-*) 의 행을 비워둠. fix_speed_master_option_b.py
        # 가 멱등 (equipment_code, cross_section) UPSERT 로 누락 행을 보강. 미적용 시
        # test_speed_master_coverage / test_pipeline_alignment / test_sheath_color_chain
        # 등이 row missing 으로 FAIL.
        working-directory: backend
        run: python scripts/fix_speed_master_option_b.py

      - name: Run pytest
        # Exclude tests that assume Supabase-state-specific seed:
        #   - test_constraint_loader: 다 같은 (category,priority) 라 정렬 불변식 깨짐
        #   - test_constraint_params_is_enabled: 8-1 등 disabled flag 기대 (CI 시드는 모두 enabled)
        #   - test_overload_split: 과부하 시나리오 sales_order/equipment 풀 시드 필요
        #   - test_priority_slider_objective: W-DHARD 등 W-* 행이 01_nominal 스냅샷에 없음
        #   - test_wip_output_expected_m: DrumLotMaster lot_stranding 등 추가 컬럼 필요
        # 모두 Supabase 환경에서 PASS, fresh CI 에서는 데이터 없음. 후속 fixture
        # 보강 또는 markers 도입까지 ignore. (parity harness 는 2026-05-21 폐기.)
        working-directory: backend
        run: |
          pytest -q \
            --ignore=tests/test_constraint_loader.py \
            --ignore=tests/test_constraint_params_is_enabled.py \
            --ignore=tests/test_overload_split.py \
            --ignore=tests/test_priority_slider_objective.py \
            --ignore=tests/test_wip_output_expected_m.py

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm run test
