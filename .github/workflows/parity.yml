# Parity harness CI - Week 1 Task 1.9 of the Production Handoff Refactor.
#
# Separate from ci.yml because:
#   - Parity uses a freshly-migrated throwaway Postgres (Path D constraint:
#     no Supabase access from CI) + a hand-loaded masterdata snapshot, which
#     ci.yml explicitly sidesteps via pytest --ignore=tests/test_parity_harness.py.
#   - Parity is slower than the rest of the test suite (solver warm-up +
#     masterdata seed); running it on a narrower paths filter keeps
#     unrelated PRs (docs, frontend, ops) out of a ~3-minute job.
#   - The check_performance_regression.py gate wants a clean, quiet
#     machine (other tests crowd the same runner). Giving it its own job
#     avoids noisy-neighbour drift in the measured timings.
#
# Hash freeze (Task 1.5) + fixture guard (Task 1.7) make every failure
# here actionable: either the solver drifted (needs investigation) or a
# parity-update commit is missing (the guard catches that first).
#
# Security note: this workflow does NOT interpolate any github.event.*
# user-controlled text into run: blocks. Only github.ref is referenced
# (in concurrency.group), which GitHub validates as a git ref name.

name: Parity

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "backend/**"
      - ".github/workflows/parity.yml"
  push:
    branches:
      [main, refactoring, refactoring-track-a-solver, refactoring-track-b-admin]
    paths:
      - "backend/**"
      - ".github/workflows/parity.yml"

# Least-privilege: we only need to read source.
permissions:
  contents: read

# A new push on the same ref supersedes the in-flight run - avoids the
# CI queue clogging up during iterative pushes.
concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      # Same shape as ci.yml - intentional: when ci.yml changes image or
      # credentials, parity must track lock-step or drift will surface as
      # a mystery hash mismatch. Keep these two blocks byte-identical.
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kbi
          POSTGRES_PASSWORD: kbi_poc_2026
          POSTGRES_DB: kbi_scheduler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kbi -d kbi_scheduler"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway DB only - NEVER Supabase in CI (Path D).
      DATABASE_URL: postgresql://kbi:kbi_poc_2026@localhost:5432/kbi_scheduler
      # Deterministic narrator: template provider has no network / RNG.
      LLM_PROVIDER: template
      # Force CP-SAT to 1 worker at workflow level. conftest.py also sets
      # this at import time, but setting it here avoids a race if any
      # earlier-imported module reads the env before conftest loads.
      CPSAT_WORKERS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run alembic migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Seed masterdata for parity harness
        # The parity fixtures live-read equipment_master / speed_master /
        # constraint_config / drum_lot_master (see _parity_helpers.py
        # "masterdata from live DB" block). A fresh postgres has zero
        # rows in those tables, so without this step every parity test
        # would crash at solver input build.
        working-directory: backend
        run: python scripts/seed_masterdata_for_ci.py

      - name: Run parity harness (make parity)
        # Matches the local Makefile target - 11/11 expected green per
        # Task 1.5 freeze. Runtime budget ~10s solver + 20s overhead.
        # Switch to --parity-quick here if CI ever approaches the
        # 10-minute timeout; the Makefile has the equivalent target.
        working-directory: backend
        run: pytest tests/test_parity_harness.py -m parity -v

      - name: Performance regression gate
        # Exit codes (per scripts/check_performance_regression.py docstring):
        #   0 = OK / WARN       (pipeline green; WARN is advisory)
        #   1 = FAIL            (perf gate tripped; block the PR)
        #   2 = internal error  (baseline unreadable, env broken)
        #   3 = hash drift      (solver output changed; parity-update needed)
        # N=3 is the CI budget - baseline was frozen at N=20; the script
        # uses max(timings) as a p99 proxy so 3 runs are sufficient to
        # detect 1.5x/2x regressions without stealing 2 minutes per job.
        working-directory: backend
        run: python scripts/check_performance_regression.py --all --n-runs 3
