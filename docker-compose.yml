version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: kbi_postgres
    environment:
      POSTGRES_DB: kbi_scheduler
      POSTGRES_USER: kbi
      POSTGRES_PASSWORD: kbi_poc_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
