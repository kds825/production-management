<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<div class="row" style="gap:10px">
  
    <div class="col" style="gap:4px">
      <div style="width:120px;height:34px;background:#DCFCE7;color:#16A34A;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600">Success</div>
      <div class="hex">fg #16A34A</div>
      <div class="hex">bg #DCFCE7</div>
      <div class="label">OK · complete</div>
    </div>
    <div class="col" style="gap:4px">
      <div style="width:120px;height:34px;background:#FFF1E5;color:#EC6900;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600">Progress</div>
      <div class="hex">fg #EC6900</div>
      <div class="hex">bg #FFF1E5</div>
      <div class="label">In progress</div>
    </div>
    <div class="col" style="gap:4px">
      <div style="width:120px;height:34px;background:#F5EFE9;color:#93785F;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600">Warning</div>
      <div class="hex">fg #93785F</div>
      <div class="hex">bg #F5EFE9</div>
      <div class="label">Near due</div>
    </div>
    <div class="col" style="gap:4px">
      <div style="width:120px;height:34px;background:#F8DFE3;color:#D71837;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600">Danger</div>
      <div class="hex">fg #D71837</div>
      <div class="hex">bg #F8DFE3</div>
      <div class="label">Delay · violation</div>
    </div>
    <div class="col" style="gap:4px">
      <div style="width:120px;height:34px;background:#F3F3F4;color:#909297;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600">Idle</div>
      <div class="hex">fg #909297</div>
      <div class="hex">bg #F3F3F4</div>
      <div class="label">Disabled · waiting</div>
    </div>
</div></body></html>
