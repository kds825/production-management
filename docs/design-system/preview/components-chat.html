<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<div style="width:380px;background:#fff;border:1px solid var(--border-1);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px">
  <div style="display:flex;justify-content:flex-end">
    <div style="background:var(--kbi-warm-gray-tint-5);color:var(--fg-1);padding:8px 12px;border-radius:10px 10px 2px 10px;font-size:13px;max-width:80%">1호기 오후 작업을 3호기로 옮겨줘</div>
  </div>
  <div style="display:flex;justify-content:flex-start;gap:8px">
    <div style="width:24px;height:24px;border-radius:999px;background:var(--kbi-sunrise-red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0">AI</div>
    <div style="background:#fff;border:1px solid var(--border-1);color:var(--fg-1);padding:8px 12px;border-radius:2px 10px 10px 10px;font-size:13px;max-width:80%">3호기 오후 슬롯 가용. 이동 시 납기 충족, 부하율 +12%. 적용할까요?</div>
  </div>

    <input placeholder="메시지 입력…" style="flex:1;height:32px;border:1px solid var(--pwc-border);border-radius:4px;padding:0 10px;font-size:13px;outline:none" />
    <button style="width:32px;height:32px;background:var(--kbi-sunrise-red);color:#fff;border:0;border-radius:4px;cursor:pointer;font-size:14px">→</button>
  </div>
