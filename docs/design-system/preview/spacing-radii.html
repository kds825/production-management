<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<div class="row" style="gap:14px">
  
    <div class="col" style="gap:6px;align-items:center">
      <div style="width:84px;height:60px;background:var(--bg-canvas);border:1px solid var(--border-1);border-radius:2px"></div>
      <div class="name">xs</div>
      <div class="hex">2px</div>
    </div>
    <div class="col" style="gap:6px;align-items:center">
      <div style="width:84px;height:60px;background:var(--bg-canvas);border:1px solid var(--border-1);border-radius:4px"></div>
      <div class="name">sm</div>
      <div class="hex">4px</div>
    </div>
    <div class="col" style="gap:6px;align-items:center">
      <div style="width:84px;height:60px;background:var(--bg-canvas);border:1px solid var(--border-1);border-radius:6px"></div>
      <div class="name">md</div>
      <div class="hex">6px</div>
    </div>
    <div class="col" style="gap:6px;align-items:center">
      <div style="width:84px;height:60px;background:var(--bg-canvas);border:1px solid var(--border-1);border-radius:8px"></div>
      <div class="name">lg</div>
      <div class="hex">8px</div>
    </div>
    <div class="col" style="gap:6px;align-items:center">
      <div style="width:84px;height:60px;background:var(--bg-canvas);border:1px solid var(--border-1);border-radius:999px"></div>
      <div class="name">pill</div>
      <div class="hex">999px</div>
    </div>
</div>
<div class="label" style="margin-top:10px">PwC standard for cards/buttons is <b>sm (4px)</b>. Pills only for badges.</div></body></html>
