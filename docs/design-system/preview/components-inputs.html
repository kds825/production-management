<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<div class="row" style="gap:12px;align-items:flex-start">
  <div class="col" style="gap:6px">
    <div class="t-label" style="color:var(--fg-2)">호기 선택</div>
    <input placeholder="검색…" style="width:200px;height:36px;border:1px solid var(--pwc-border);border-radius:4px;padding:0 10px;font-size:14px;outline:none" />

  </div>
  <div class="col" style="gap:6px">
    <div class="t-label" style="color:var(--fg-2)">납기일</div>
    <input value="2026-05-12" style="width:200px;height:36px;border:1.5px solid var(--kbi-sunrise-red);border-radius:4px;padding:0 10px;font-size:14px;outline:none;box-shadow:var(--shadow-focus)" />
    <div class="label">Focus · KBI Red ring</div>
  </div>
  <div class="col" style="gap:6px">
    <div class="t-label" style="color:var(--fg-2)">작업 코드</div>
    <input value="KBI-INVALID" style="width:200px;height:36px;border:1.5px solid var(--kbi-sunrise-red);border-radius:4px;padding:0 10px;font-size:14px;color:var(--kbi-sunrise-red);outline:none" />
    <div class="hex" style="color:var(--kbi-sunrise-red)">존재하지 않는 작업입니다</div>
  </div>
